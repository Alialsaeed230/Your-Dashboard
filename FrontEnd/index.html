<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENA Job Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>MENA Job Dashboard</h1>

    <form id="app-form">
        <input type="text" id="company" placeholder="Company Name" required>
        <input type="text" id="role" placeholder="Role Title" required>
        <select id="status">
            <option value="Applied">Applied</option>
            <option value="Interviewing">Interviewing</option>
            <option value="Offered">Offered</option>
            <option value="Rejected">Rejected</option>
        </select>
        <button type="submit">Save Application</button>
    </form>

    <h2>Saved Applications</h2>
    <table>
        <thead>
            <tr>
                <th>Company</th>
                <th>Role</th>
                <th>Status</th>
                <th>Date Applied</th>
                <th style="text-align: center;">Remove</th>
            </tr>
        </thead>
        <tbody id="app-list"></tbody>
    </table>

    <h2 style="margin-top: 40px;">Live Opportunities Feed</h2>
    <ul id="scraped-list"></ul>

    <script src="app.js"></script>
</body>
</html>
